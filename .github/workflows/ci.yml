name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-arch:
    name: Arch Linux x86_64 / build and test
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            cmake ninja git pkgconf \
            qt6-base qt6-tools \
            kconfig kconfigwidgets kcolorscheme kcoreaddons kdbusaddons \
            ki18n kwallet kxmlgui krunner \
            hiredis zlib zstd brotli msgpack-c curl hicolor-icon-theme \
            redis appstream desktop-file-utils

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON

      - name: Build
        run: |
          set -o pipefail
          cmake --build build --parallel 2>&1 | tee build.log

      - name: Build failure summary
        if: failure()
        run: |
          {
            echo '### Build log'
            echo '```'
            tail -n 120 build.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Test
        env:
          KEYDIS_REDIS_PORT: 6379
        run: |
          redis-server --daemonize yes
          ctest --test-dir build --output-on-failure

      - name: Install smoke test
        run: |
          DESTDIR="$RUNNER_TEMP/install" cmake --install build --prefix /usr
          QT_QPA_PLATFORM=offscreen "$RUNNER_TEMP/install/usr/bin/keydis" --version
          desktop-file-validate "$RUNNER_TEMP/install/usr/share/applications/"*.desktop
          appstreamcli validate --no-net "$RUNNER_TEMP/install/usr/share/metainfo/"*.xml
          test -f "$RUNNER_TEMP/install/usr/share/licenses/keydis/LICENSE"

      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: x86_64-test-log
          path: |
            build/Testing/Temporary/LastTest.log
            build.log
          if-no-files-found: ignore

  clang-build:
    name: Arch Linux x86_64 / Clang
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            cmake ninja git pkgconf clang \
            qt6-base qt6-tools \
            kconfig kconfigwidgets kcolorscheme kcoreaddons kdbusaddons \
            ki18n kwallet kxmlgui krunner \
            hiredis zlib zstd brotli msgpack-c redis

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DBUILD_TESTING=ON

      - name: Build
        run: |
          set -o pipefail
          cmake --build build --parallel 2>&1 | tee build.log

      - name: Test
        env:
          KEYDIS_REDIS_PORT: 6379
        run: |
          redis-server --daemonize yes
          ctest --test-dir build --output-on-failure

      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: clang-test-log
          path: |
            build/Testing/Temporary/LastTest.log
            build.log
          if-no-files-found: ignore

  sanitizers:
    name: Arch Linux x86_64 / ASan + UBSan
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            cmake ninja git pkgconf \
            qt6-base qt6-tools \
            kconfig kconfigwidgets kcolorscheme kcoreaddons kdbusaddons \
            ki18n kwallet kxmlgui krunner \
            hiredis zlib zstd brotli msgpack-c redis

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DBUILD_TESTING=ON

      - name: Build
        run: |
          set -o pipefail
          cmake --build build --parallel 2>&1 | tee build.log

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          KEYDIS_REDIS_PORT: 6379
        run: |
          redis-server --daemonize yes
          ctest --test-dir build --output-on-failure

      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sanitizer-test-log
          path: |
            build/Testing/Temporary/LastTest.log
            build.log
          if-no-files-found: ignore

  metadata:
    name: Desktop and AppStream metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install validators
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            appstream desktop-file-utils

      - name: Validate AppStream metadata
        run: appstreamcli validate --no-net data/io.github.keydis.KeyDis.metainfo.xml

      - name: Validate desktop entry
        run: desktop-file-validate data/io.github.keydis.KeyDis.desktop

  arch-arm64:
    name: Arch Linux ARM64 / build, test, package
    runs-on: ubuntu-24.04-arm
    container: menci/archlinuxarm:base-devel
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Bootstrap Arch Linux ARM
        run: |
          set -x
          sed -i 's|^Server = http://|Server = https://|' /etc/pacman.d/mirrorlist
          sed -i 's/^#DisableSandboxFilesystem/DisableSandboxFilesystem/' /etc/pacman.conf
          sed -i 's/^#DisableSandboxSyscalls/DisableSandboxSyscalls/' /etc/pacman.conf
          pacman-key --init
          pacman-key --populate archlinuxarm
          pacman -Syu --noconfirm

      - name: Install dependencies
        run: |
          pacman -S --noconfirm --needed \
            base-devel shadow util-linux cmake ninja git pkgconf sudo \
            qt6-base qt6-tools \
            kconfig kconfigwidgets kcolorscheme kcoreaddons kdbusaddons \
            ki18n kwallet kxmlgui krunner \
            hiredis zlib zstd brotli msgpack-c curl hicolor-icon-theme \
            redis appstream desktop-file-utils

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON

      - name: Build
        run: |
          set -o pipefail
          cmake --build build --parallel 2>&1 | tee build.log

      - name: Build failure summary
        if: failure()
        run: |
          {
            echo '### Build log'
            echo '```'
            tail -n 120 build.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Test
        env:
          KEYDIS_REDIS_PORT: 6379
        run: |
          redis-server --daemonize yes
          ctest --test-dir build --output-on-failure

      - name: Verify tag matches PKGBUILD version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkgver="$(sed -n 's/^pkgver=//p' packaging/arch/PKGBUILD)"
          echo "tag=[$tag] pkgver=[$pkgver]"
          test "$tag" = "$pkgver"

      - name: Pin tag source checksum
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          url="https://github.com/gomodb/keydis/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz"
          curl -L --fail --retry 3 --max-time 120 "$url" -o /tmp/keydis-source.tar.gz
          sha="$(sha256sum /tmp/keydis-source.tar.gz | cut -d' ' -f1)"
          sed -i "s|^sha256sums=.*|sha256sums=('$sha')|" packaging/arch/PKGBUILD
          grep '^sha256sums=' packaging/arch/PKGBUILD

      - name: Prepare package builder
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Build package
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        run: |
          cd "$GITHUB_WORKSPACE/packaging/arch"
          set -o pipefail
          sudo -u builder makepkg -f --noconfirm 2>&1 | tee arch-build.log

      - name: Install and smoke test
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        run: |
          ls -la packaging/arch >> arm-install.log 2>&1 || true
          package="$(find packaging/arch -maxdepth 1 -type f -name 'keydis-*.pkg.tar.*' | head -n1)"
          echo "package=[$package]" >> arm-install.log
          test -n "$package"
          pacman -U --noconfirm "$package" 2>&1 | tee -a arm-install.log
          QT_QPA_PLATFORM=offscreen keydis --version 2>&1 | tee -a arm-install.log
          desktop-file-validate /usr/share/applications/io.github.keydis.KeyDis.desktop 2>&1 | tee -a arm-install.log
          appstreamcli validate --no-net /usr/share/metainfo/io.github.keydis.KeyDis.metainfo.xml 2>&1 | tee -a arm-install.log

      - name: Upload aarch64 package
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: keydis-archlinuxarm
          path: packaging/arch/keydis-*.pkg.tar.*
          if-no-files-found: error

      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: arm64-test-log
          path: |
            build/Testing/Temporary/LastTest.log
            build.log
            packaging/arch/arch-build.log
          if-no-files-found: ignore

  package:
    name: Arch Linux x86_64 package
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install packaging dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git cmake ninja pkgconf sudo util-linux \
            qt6-base qt6-tools \
            kconfig kconfigwidgets kcolorscheme kcoreaddons kdbusaddons \
            ki18n kwallet kxmlgui krunner \
            hiredis zlib zstd brotli msgpack-c curl hicolor-icon-theme \
            appstream desktop-file-utils namcap

      - name: Verify tag matches PKGBUILD version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkgver="$(sed -n 's/^pkgver=//p' packaging/arch/PKGBUILD)"
          echo "tag=[$tag] pkgver=[$pkgver]"
          test "$tag" = "$pkgver"

      - name: Pin tag source checksum
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          url="https://github.com/gomodb/keydis/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz"
          curl -L --fail --retry 3 --max-time 120 "$url" -o /tmp/keydis-source.tar.gz
          sha="$(sha256sum /tmp/keydis-source.tar.gz | cut -d' ' -f1)"
          sed -i "s|^sha256sums=.*|sha256sums=('$sha')|" packaging/arch/PKGBUILD
          grep '^sha256sums=' packaging/arch/PKGBUILD

      - name: Prepare builder
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Build package
        run: |
          cd "$GITHUB_WORKSPACE/packaging/arch"
          set -o pipefail
          sudo -u builder makepkg -f --noconfirm 2>&1 | tee arch-build.log

      - name: Install and smoke test
        run: |
          package="$(find packaging/arch -maxdepth 1 -name 'keydis-[0-9]*.pkg.tar.zst' | head -n1)"
          test -n "$package"
          pacman -U --noconfirm "$package"
          QT_QPA_PLATFORM=offscreen keydis --version
          desktop-file-validate /usr/share/applications/io.github.keydis.KeyDis.desktop
          appstreamcli validate --no-net /usr/share/metainfo/io.github.keydis.KeyDis.metainfo.xml

      - name: Run namcap
        run: |
          set -o pipefail
          namcap packaging/arch/PKGBUILD | tee namcap-pkgbuild.log || true
          namcap packaging/arch/keydis-[0-9]*.pkg.tar.zst | tee namcap-package.log || true
          if grep -Eq '(^|[[:space:]])E: ' namcap-pkgbuild.log namcap-package.log; then
            echo "namcap reported errors"
            exit 1
          fi

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: keydis-arch-package
          path: packaging/arch/keydis-[0-9]*.pkg.tar.zst
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: package-build-log
          path: |
            packaging/arch/arch-build.log
            namcap-pkgbuild.log
            namcap-package.log
          if-no-files-found: ignore

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package, arch-arm64]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download x86_64 package
        uses: actions/download-artifact@v4
        with:
          name: keydis-arch-package
          path: dist

      - name: Download aarch64 package
        uses: actions/download-artifact@v4
        with:
          name: keydis-archlinuxarm
          path: dist

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum *.pkg.tar.* > SHA256SUMS
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" ./*.pkg.tar.* SHA256SUMS --clobber
          else
            gh release create "$GITHUB_REF_NAME" ./*.pkg.tar.* SHA256SUMS \
              --title "KeyDis $GITHUB_REF_NAME" \
              --generate-notes
          fi
